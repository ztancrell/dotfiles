include homestead.conf

# Shift+Enter inserts a newline in TUI apps (ported from alacritty.toml)
map shift+enter send_text all \x1b\r

# Drop Claude Code's idle-prompt notice; it isn't a real request. Permission prompts still notify.
filter_notification body:"waiting for your input"

# Font: DejaVu Sans Mono, the open font macOS Menlo derives from (matches the Mac Alacritty config)
font_family DejaVu Sans Mono
